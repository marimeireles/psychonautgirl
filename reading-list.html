<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Kalam:wght@400;700&family=Patrick+Hand&family=Indie+Flower&family=Reenie+Beanie&family=Nanum+Pen+Script&family=Shadows+Into+Light&family=Gloria+Hallelujah&family=Zeyada&family=Homemade+Apple&family=Covered+By+Your+Grace&family=Just+Another+Hand&family=Architects+Daughter&family=La+Belle+Aurore&family=Waiting+for+the+Sunrise&family=Rock+Salt&display=swap" rel="stylesheet">
    <title>♡ ｂｏｏｋ　ｌｉｓｔ ♡</title>
    <style>
        :root { --ink: #1f3f9e; }
        @font-face {
            font-family: 'Cookiemonster-gv11';
            src: url('fonts/Cookiemonster-gv11.ttf') format('truetype');
        }

        /* Paper scrap: white, soft offset shadow, slight tilt */
        .scrap {
            background: #ffffff;
            color: #1f3f9e;
            border: none;
            border-radius: 2px;
            box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.12), 0 6px 10px rgba(0, 0, 0, 0.12);
        }
        #title-wrap {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 28px 0 6px;
        }
        #title-wrap h1 {
            display: inline-block;
            margin: 0;
            padding: 6px 42px 10px;
            font-size: 5.2em;
            line-height: 1;
            font-family: 'Cookiemonster-gv11', Arial, sans-serif;
            color: #1f3f9e;
            transform: rotate(-1.5deg);
            background-image: repeating-linear-gradient(180deg, transparent 0 26px, rgba(120, 160, 210, 0.45) 26px 27px);
        }
        body {
            margin: 0;
            background: #87CEEB; /* Soft blue sky */
            font-family: 'Indie Flower', 'Patrick Hand', cursive;
            color: rgba(0, 0, 0, 0.7);
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #main-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 0px;
        }
        #paper-wrap {
            width: 80%;
            position: relative;
            z-index: 1000;
            margin-top: 22px;
            margin-bottom: 24px; /* Space at the bottom for scrolling */
            filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, 0.18)) drop-shadow(0 10px 14px rgba(0, 0, 0, 0.12));
        }
        /* Loose sheets behind the top one. Each runs the full length of the page; the
           corners are nudged by a few px so the edges sit at slightly different angles. */
        .sheet {
            position: absolute;
            inset: -14px;
            background: #f6f4ee;
            z-index: -1;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        .sheet.s1 { clip-path: polygon(4px 10px, calc(100% - 22px) 2px, calc(100% - 8px) calc(100% - 6px), 18px calc(100% - 14px)); }
        .sheet.s2 { background: #eeece5; clip-path: polygon(20px 4px, calc(100% - 2px) 14px, calc(100% - 20px) calc(100% - 2px), 6px calc(100% - 20px)); }
        .sheet.s3 { background: #e6e4dc; clip-path: polygon(0px 18px, calc(100% - 12px) 0px, 100% calc(100% - 16px), 26px 100%); }
        .sheet.s4 { background: #efede6; clip-path: polygon(14px 0px, calc(100% - 30px) 8px, calc(100% - 4px) 100%, 0px calc(100% - 4px)); }
        /* Pager at the foot of the page */
        #pager {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 26px;
            font-family: 'Patrick Hand', 'Indie Flower', cursive;
            font-size: 1.2em;
            color: #1f3f9e;
        }
        .pager-btn {
            font-family: 'Cookiemonster-gv11', Arial, sans-serif;
            font-size: 1em;
            padding: 4px 14px;
            cursor: pointer;
        }
        .pager-btn:nth-child(1) { transform: rotate(-1.5deg); }
        .pager-btn:nth-child(3) { transform: rotate(1.2deg); }
        .pager-btn:hover:not(:disabled) { background: #fff6b0; }
        .pager-btn:disabled { opacity: 0.35; cursor: default; }

        /* Scribble layer: sits on the paper only, never blocks clicks, scribbles accumulate */
        #scribbles {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: visible;
        }

        #table-container {
            position: relative;
            z-index: 1;
            width: 100%;
            box-sizing: border-box;
            /* Notebook page: white paper, red margin line on the left, torn edge */
            background-color: #ffffff;
            background-image:
                linear-gradient(90deg, transparent 44px, rgba(222, 110, 120, 0.55) 44px, rgba(222, 110, 120, 0.55) 46px, transparent 46px);
            padding: 18px 22px 24px 58px;
            color: #1f3f9e; /* ballpoint blue */
        }
        th {
            color: #1f3f9e;
        }
        /* per-character weathering: each glyph may be a touch bigger or smaller, leaned, lifted, or lighter */
        .word { white-space: nowrap; }
        .ch { display: inline-block; }
        #table-container table {
            width: 100%;
        }
        #searchInput {
            padding: 8px 14px;
            outline: none;
            width: 22%;
            font-size: 1.2em;
            font-family: 'Patrick Hand', 'Indie Flower', cursive;
            transform: rotate(1deg);
            z-index: 999;
        }
        #searchInput:focus, #bookName:focus {
            background-color: #fffdf0;
        }
        #bookName {
            padding: 8px 14px;
            outline: none;
            font-size: 0.75em;
            font-family: 'Patrick Hand', 'Indie Flower', cursive;
            transform: rotate(-0.8deg);
        }
        #search-container {
            width: 80%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        #book-container {
            width: 80%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: -48px;
            align-items: center;
            gap: 10px;
            font-size: 1.5em; /* Increase font size */
            font-family: 'Cookiemonster-gv11', Arial, sans-serif;
            color: #1f3f9e;
            z-index: 999;
        }
        #book-container form {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #book-container label {
            padding: 2px 12px;
            transform: rotate(-2deg);
        }
        #bookInput {
            border-radius: 25px; /* Rounded corners */
            padding: 10px 10px; /* Padding for better appearance */
            outline: none; /* Remove default outline */
/*            width: 10%;*/
            font-size: 1.05em; /* Increase font size */
            font-family: 'Times New Roman', serif;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.9); /* Semi-transparent background */
        }

        #bookInput:focus {
            background-color: #ffffff; /* Change background color on focus */
        }
        table, th, td {
            border-collapse: collapse;
            padding: 5px;
            font-size: 1.1em;
        }

        tr {
            border-bottom: 1px solid rgba(120, 160, 210, 0.55); /* ruled line */
        }
        tbody tr td {
            padding: 7px 6px;
            vertical-align: middle;
        }
        tbody tr td:first-child {
            font-size: 1.15em;
        }
        tbody tr:hover {
            background: rgba(255, 240, 150, 0.35); /* highlighter */
        }


        th, td {
            text-align: left;
        }
        thead tr {
            border-bottom: 2px solid rgba(0, 0, 0, 0.5);
        }
        th {
            font-family: 'Cookiemonster-gv11', Arial, sans-serif;
            border-bottom: none;
            font-size: 1.5em;
            min-width: 120px;
        }
        .arrow {
            cursor: pointer;
        }
        .status-column {
            padding-right: 20px; /* Adjust the value as needed for the desired space */
        }

        .status-column,
        td:nth-child(2) {
            padding-right: 20px; /* Ensure this applies to all rows */
        }
        /* Type tags as little post-its */
        .tag {
            display: inline-block;
            padding: 7px 9px 6px;
            margin: 3px 4px 3px 0;
            border-radius: 1px;
            font-size: 0.8em;
            line-height: 1.1;
            box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.18);
            /* a slightly darker strip along the top, where the glue is */
            background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.07) 0 24%, transparent 24%);
        }
        .send-button {
            font-family: 'Cookiemonster-gv11', Arial, sans-serif;
            font-size: 1em;
            padding: 2px 12px;
            cursor: pointer;
            transform: rotate(2deg);
        }
        #searchInput::placeholder, #bookName::placeholder {
            color: rgba(31, 63, 158, 0.5);
        }
        .send-button:hover {
            background: #fff6b0;
        }

        @media (max-width: 1280px) and (min-width: 1025px) {
    #book-container {
        display: flex;
        flex-wrap: wrap;
        gap: 100px;
        align-items: center;
    }

    #search-container {
        flex: 0 0 20%;
        display: flex;
        justify-content: flex-end;
    }

    #searchInput {
        width: 20%;
    }
}

@media (max-width: 1024px) and (min-width: 769px) {
    h1 {
        font-size: 5em;
        margin: 30px 0;
    }

    #search-container {
        width: 85%;
        justify-content: flex-end;
        margin-bottom: 15px;
    }

    #searchInput {
        width: 40%;
        font-size: 1.1em;
    }

    #book-container {
        width: 85%;
        justify-content: flex-start;
        margin-bottom: 15px;
        font-size: 1.3em;
    }

    #book-container form {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
    }

    #bookName {
        width: 400px !important;
        font-size: 0.9em;
    }

    .send-button {
        font-size: 0.9em;
        padding: 10px 15px;
    }

    #paper-wrap {
        width: 85%;
    }

    #table-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    table, th, td {
        font-size: 1em;
    }

    th, td {
        min-width: 100px;
        padding: 8px;
    }
}

@media (max-width: 768px) {
    /* on a phone only the name, status and type columns fit */
    #data-table th:nth-child(4), #data-table td:nth-child(4),
    #data-table th:nth-child(5), #data-table td:nth-child(5) {
        display: none;
    }
    h1 {
        font-size: 3em;
        margin: 20px 0;
    }

    #search-container {
        width: 90%;
        justify-content: center;
        margin-bottom: 20px;
    }

    #searchInput {
        width: 100%;
        font-size: 1em;
    }

    #book-container {
        width: 90%;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 1.2em;
    }

    #book-container form {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    #book-container label {
        text-align: center;
        width: 100%;
    }

    #bookName {
        width: 100% !important;
        max-width: 100%;
        font-size: 1em;
    }

    .send-button {
        font-size: 1em;
        padding: 8px 20px;
    }

    #paper-wrap {
        width: 95%;
    }

    #table-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    table {
        width: 100%;
        display: block;
        overflow-x: auto;
    }

    table, th, td {
        font-size: 0.85em;
    }

    th, td {
        min-width: 80px;
        padding: 8px 5px;
    }

    th:first-child, td:first-child {
        min-width: 120px;
    }
}

@media (max-width: 480px) {
    h1 {
        font-size: 2em;
        margin: 15px 0;
    }

    #book-container {
        font-size: 1em;
    }

    table, th, td {
        font-size: 0.75em;
    }

    th, td {
        min-width: 60px;
        padding: 6px 3px;
    }

    th:first-child, td:first-child {
        min-width: 100px;
    }

    .tag {
        font-size: 0.75em;
        padding: 3px 6px;
    }
}
    </style>
</head>

<body>
<div id="title-wrap"><h1 class="scrap">Reading List</h1></div>
<canvas id="skyCanvas"></canvas>
<div id="main-content">
    <div id="book-container">
      <form
        action="https://formspree.io/f/xjvndedd"
        method="POST">
            <label for="bookName" class="scrap">Recommend a book:</label>
            <input type="text" id="bookName" name="bookName" class="scrap" placeholder="t y p e . . ."  style="width:420px">
            <button type="submit" class="send-button scrap"> send
            </button>
        </form>
    </div>

    <div id="search-container">
        <input type="text" id="searchInput" class="scrap" placeholder="s e a r c h . . ." onkeyup="filterData()">
    </div>
    <div id="paper-wrap">
    <div class="sheet s1"></div><div class="sheet s2"></div><div class="sheet s3"></div><div class="sheet s4"></div>
    <div id="table-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th>Name <span class="arrow" onclick="sortData('Name', 'asc')">↑</span><span class="arrow" onclick="sortData('Name', 'desc')">↓</span></th>
                    <th class="status-column">Status <span class="arrow" onclick="sortData('Status', 'asc')">↑</span><span class="arrow" onclick="sortData('Status', 'desc')">↓</span></th>

                    <th>Type <span class="arrow" onclick="sortData('Type', 'asc')">↑</span><span class="arrow" onclick="sortData('Type', 'desc')">↓</span></th>
                    <th>Author </th>
                    <th>Notes </th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Dynamic rows here -->
            </tbody>
        </table>
        <div id="pager">
            <button id="pager-prev" class="scrap pager-btn" onclick="goPage(-1)">← prev</button>
            <span id="pager-label"></span>
            <button id="pager-next" class="scrap pager-btn" onclick="goPage(1)">next →</button>
        </div>
    </div>
    <svg id="scribbles" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
</div>
<script src="books.js"></script>

<script>
    // Torn paper edge: a polygon with small nicks (a few px) along every side.
    // Depths are in px so they stay small however tall the page gets.
    (function tornEdge() {
        const pts = [];
        const step = 1.2;   // % between points along each side
        const depth = 5;    // max nick depth in px
        const d = () => ((Math.random() - 0.5) * 2 * depth).toFixed(1);
        for (let x = 0; x <= 100; x += step) pts.push(`${x}% ${Math.abs(d())}px`);
        for (let y = 0; y <= 100; y += step) pts.push(`calc(100% - ${Math.abs(d())}px) ${y}%`);
        for (let x = 100; x >= 0; x -= step) pts.push(`${x}% calc(100% - ${Math.abs(d())}px)`);
        for (let y = 100; y >= 0; y -= step) pts.push(`${Math.abs(d())}px ${y}%`);
        document.getElementById('table-container').style.clipPath = `polygon(${pts.join(',')})`;
    })();

    // Weather the column headers too (the title stays clean)
    (function weatherHeadings() {
        document.querySelectorAll('#data-table th').forEach(th => {
            [...th.childNodes].forEach(node => {
                if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
                    const span = document.createElement('span');
                    span.innerHTML = weather(node.textContent.trim()) + ' ';
                    th.replaceChild(span, node);
                }
            });
        });
    })();

    // ---------- Scribbles ----------
    // Every so often a pen scribble draws itself onto the visible part of the page and stays.
    (function scribbles() {
        const svg = document.getElementById('scribbles');
        const wrap = document.getElementById('paper-wrap');

        // Each page of the list keeps its own scribbles. Only the current page's layer is shown.
        const pageLayers = new Map();
        let currentLayer = null;
        window.setScribblePage = (n) => {
            if (!pageLayers.has(n)) {
                const g = document.createElementNS(svg.namespaceURI, 'g');
                svg.appendChild(g);
                pageLayers.set(n, g);
            }
            pageLayers.forEach((g, key) => { g.style.display = key === n ? '' : 'none'; });
            currentLayer = pageLayers.get(n);
        };
        window.setScribblePage(0);
        const layer = () => currentLayer || svg;
        const rand = (a, b) => a + Math.random() * (b - a);
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];

        // Hand tremor: nudge every point, and now and then add a jerk
        function tremor(pts, amt) {
            return pts.map(p => {
                const jerk = Math.random() < 0.08 ? rand(2, 5) : 1;
                return { x: p.x + rand(-amt, amt) * jerk, y: p.y + rand(-amt, amt) * jerk };
            });
        }

        // Smooth path with varying tension; some segments come out sharp instead of curved
        function smooth(pts, sharpness) {
            let d = `M${pts[0].x},${pts[0].y}`;
            for (let i = 0; i < pts.length - 1; i++) {
                const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
                if (Math.random() < sharpness) { d += ` L${p2.x},${p2.y}`; continue; }
                const t = rand(0.08, 0.4);
                d += ` C${p1.x + (p2.x - p0.x) * t},${p1.y + (p2.y - p0.y) * t} ${p2.x - (p3.x - p1.x) * t},${p2.y - (p3.y - p1.y) * t} ${p2.x},${p2.y}`;
            }
            return d;
        }

        const styles = {
            loops(W, H) {
                const pts = []; const n = 70; const turns = 5 + Math.floor(rand(0, 4));
                let drift = 0;
                for (let i = 0; i < n; i++) {
                    const t = i / (n - 1); const a = t * turns * Math.PI * 2 + rand(-0.3, 0.3);
                    const r = H * rand(0.2, 0.48); drift += rand(-3, 3);
                    pts.push({ x: t * W * rand(0.75, 0.95) + Math.cos(a) * r * rand(0.6, 1), y: H / 2 + Math.sin(a) * r + drift });
                }
                return pts;
            },
            doodle(W, H) {
                const pts = []; const n = 60; const cx = W * 0.4, cy = H / 2;
                for (let i = 0; i < n; i++) {
                    const a = rand(0, Math.PI * 2); const r = rand(0.2, 1) * Math.min(W * 0.35, H * 0.55);
                    pts.push({ x: cx + Math.cos(a) * r * 1.3, y: cy + Math.sin(a) * r });
                }
                pts.push({ x: W, y: cy + rand(-H * 0.3, H * 0.3) });
                return pts;
            },
            zigzag(W, H) {
                const pts = []; const n = 12 + Math.floor(rand(0, 6));
                for (let i = 0; i < n; i++) pts.push({ x: (i / (n - 1)) * W + rand(-14, 14), y: (i % 2 ? H * rand(0.6, 1) : H * rand(0, 0.4)) });
                return pts;
            },
            tornado(W, H) {
                const pts = []; const turns = 3.5; const n = 40;
                for (let i = 0; i < n; i++) {
                    const t = i / (n - 1); const a = t * turns * Math.PI * 2; const r = (1 - t * 0.8) * Math.min(W, H) * 0.45;
                    pts.push({ x: W * 0.4 + Math.cos(a) * r + t * W * 0.5, y: H / 2 + Math.sin(a) * r * 0.7 });
                }
                return pts;
            },
            scratch(W, H) {
                const pts = []; const n = 26;
                for (let i = 0; i < n; i++) pts.push({ x: (i / (n - 1)) * W + rand(-W * 0.05, W * 0.05), y: (i % 2 ? H * 0.8 : H * 0.2) + rand(-H * 0.2, H * 0.2) });
                return pts;
            },
        };

        // ---------- Doodles ----------
        // Little drawings made of pen strokes, in a 0-100 box. Strokes draw one after another.
        const circle = (cx, cy, r, n = 20) => Array.from({ length: n + 1 }, (_, i) => {
            const a = -Math.PI / 2 + (i / n) * Math.PI * 2; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
        });
        const ellipse = (cx, cy, rx, ry, n = 20) => Array.from({ length: n + 1 }, (_, i) => {
            const a = (i / n) * Math.PI * 2; return { x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry };
        });
        const P = (...xy) => { const pts = []; for (let i = 0; i < xy.length; i += 2) pts.push({ x: xy[i], y: xy[i + 1] }); return pts; };

        const doodles = {
            demon: () => [
                circle(50, 58, 30, 26),                        // head
                P(30, 34, 22, 8, 42, 30),                      // horns
                P(70, 34, 78, 8, 58, 30),
                P(32, 48, 45, 55),                             // angry brows
                P(68, 48, 55, 55),
                circle(40, 61, 3.5, 10),                       // eyes
                circle(60, 61, 3.5, 10),
                P(32, 70, 40, 77, 50, 80, 60, 77, 68, 70),     // grin
                P(42, 72, 44, 78),                             // fangs
                P(58, 72, 56, 78),
                P(46, 88, 50, 96, 54, 88),                     // goatee
            ],
            coffee: () => [
                P(22, 45, 26, 85, 62, 85, 66, 45),             // cup
                ellipse(44, 45, 22, 5, 18),                    // rim
                P(66, 52, 80, 50, 84, 62, 76, 74, 66, 74),     // handle
                P(10, 88, 44, 97, 78, 88),                     // saucer
                P(32, 38, 28, 30, 34, 22, 30, 14),             // steam
                P(44, 36, 40, 28, 46, 20, 42, 12),
                P(56, 38, 52, 30, 58, 22, 54, 14),
            ],
            snail: () => [
                Array.from({ length: 40 }, (_, i) => {         // shell spiral
                    const t = i / 39; const a = t * 2.6 * Math.PI * 2; const r = 4 + t * 24;
                    return { x: 60 + Math.cos(a) * r, y: 56 + Math.sin(a) * r };
                }),
                P(86, 86, 60, 88, 30, 88, 16, 82, 12, 70, 18, 60, 30, 58),   // body
                P(18, 60, 10, 42),                             // antennae
                P(26, 58, 24, 40),
                circle(10, 41, 1.8, 8),
                circle(24, 39, 1.8, 8),
            ],
            ghost: () => [
                P(26, 86, 22, 60, 26, 36, 38, 20, 50, 16, 62, 20, 74, 36, 78, 60, 74, 86,
                  66, 78, 58, 88, 50, 78, 42, 88, 34, 78, 26, 86),            // body with wavy hem
                circle(42, 46, 3, 10),                         // eyes
                circle(58, 46, 3, 10),
                circle(50, 60, 4, 12),                         // oo mouth
                P(22, 60, 8, 54),                              // arms
                P(78, 60, 92, 54),
            ],
            star: () => [
                Array.from({ length: 6 }, (_, i) => {          // one-stroke pentagram
                    const a = -Math.PI / 2 + i * (Math.PI * 2 * 2 / 5); return { x: 50 + Math.cos(a) * 38, y: 52 + Math.sin(a) * 38 };
                }),
            ],
        };

        function draw(strokes, x, y, size, opts) {
            const { ink, width, op, tilt, scale, totalMs } = opts;
            const k = size / 100;
            const g = document.createElementNS(svg.namespaceURI, 'g');
            g.setAttribute('transform', `translate(${x + size / 2},${y + size / 2}) rotate(${tilt}) scale(${scale}) translate(${-size / 2},${-size / 2})`);
            layer().appendChild(g);
            const paths = strokes.map(st => {
                const pts = tremor(st.map(p => ({ x: p.x * k, y: p.y * k })), rand(0.8, 2.2) * Math.max(0.6, k));
                const path = document.createElementNS(svg.namespaceURI, 'path');
                path.setAttribute('d', smooth(pts, 0.06)); path.setAttribute('fill', 'none'); path.setAttribute('stroke', ink);
                path.setAttribute('stroke-width', width); path.setAttribute('stroke-linecap', 'round'); path.setAttribute('stroke-linejoin', 'round');
                path.setAttribute('opacity', op);
                g.appendChild(path);
                return path;
            });
            const lens = paths.map(p => p.getTotalLength());
            const total = lens.reduce((a, b) => a + b, 0);
            let t = 0;
            paths.forEach((p, i) => {
                const ms = totalMs * (lens[i] / total) + 120;   // tiny pause between strokes
                p.style.strokeDasharray = lens[i]; p.style.strokeDashoffset = lens[i];
                p.animate([{ strokeDashoffset: lens[i] }, { strokeDashoffset: 0 }], { duration: ms, delay: t, easing: 'linear', fill: 'forwards' });
                t += ms;
            });
        }

        function penOpts() {
            const hue = 222 + rand(-12, 12), light = rand(30, 46);
            return { ink: `hsl(${hue}, 68%, ${light}%)`, width: rand(1.4, 3.2), op: rand(0.55, 0.95) };
        }

        function doodle() {
            const rect = wrap.getBoundingClientRect();
            const visTop = Math.max(0, -rect.top), visBottom = Math.min(rect.height, window.innerHeight - rect.top);
            if (visBottom - visTop < 120) return;
            const size = rand(70, 130);
            const x = rand(0, Math.max(0, rect.width - size));
            const y = rand(visTop, Math.max(visTop, visBottom - size));
            const strokes = doodles[pick(Object.keys(doodles))]();
            draw(strokes, x, y, size, { ...penOpts(), tilt: rand(-12, 12), scale: rand(0.85, 1.15), totalMs: rand(1800, 3400) });
        }

        function scribble() {
            // Place it somewhere on the part of the page currently on screen
            const rect = wrap.getBoundingClientRect();
            const visTop = Math.max(0, -rect.top), visBottom = Math.min(rect.height, window.innerHeight - rect.top);
            if (visBottom - visTop < 80) return;

            const W = rand(180, 420), H = rand(70, 180);
            const x = rand(0, Math.max(0, rect.width - W));
            const y = rand(visTop, Math.max(visTop, visBottom - H));
            const pts = tremor(styles[pick(Object.keys(styles))](W, H), rand(1, 4));
            const d = smooth(pts, rand(0, 0.35));

            // Weathering: pen pressure, ink shade, tilt and scale all vary a little
            const hue = 222 + rand(-12, 12), light = rand(30, 46);
            const ink = `hsl(${hue}, 68%, ${light}%)`;
            const width = rand(1.4, 3.2), op = rand(0.55, 0.95);
            const tilt = rand(-14, 14), scale = rand(0.8, 1.25);

            const g = document.createElementNS(svg.namespaceURI, 'g');
            g.setAttribute('transform', `translate(${x + W / 2},${y + H / 2}) rotate(${tilt}) scale(${scale}) translate(${-W / 2},${-H / 2})`);
            const main = document.createElementNS(svg.namespaceURI, 'path');
            main.setAttribute('d', d); main.setAttribute('fill', 'none'); main.setAttribute('stroke', ink);
            main.setAttribute('stroke-width', width); main.setAttribute('stroke-linecap', 'round'); main.setAttribute('stroke-linejoin', 'round');
            main.setAttribute('opacity', op);
            g.appendChild(main);
            layer().appendChild(g);

            const len = main.getTotalLength();
            main.style.strokeDasharray = len; main.style.strokeDashoffset = len;
            main.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: rand(1200, 2600), easing: 'linear', fill: 'forwards' });
        }

        const either = () => (Math.random() < 0.45 ? doodle() : scribble());
        if (new URLSearchParams(location.search).get('doodles')) {
            // test mode: one of each, side by side on the top of the page
            Object.keys(doodles).forEach((name, i) => {
                draw(doodles[name](), 40 + i * 180, 80, 130, { ...penOpts(), tilt: rand(-8, 8), scale: 1, totalMs: 1500 });
            });
        } else {
            (function schedule() {
                setTimeout(() => { either(); schedule(); }, rand(20000, 45000));
            })();
            setTimeout(either, 8000);
        }
    })();

    const canvas = document.getElementById('skyCanvas');
    const ctx = canvas.getContext('2d');

    function adjustCanvasSize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    adjustCanvasSize();
    window.addEventListener('resize', adjustCanvasSize);

    function random(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    class Cloud {
        constructor() {
            this.x = random(0, canvas.width);
            this.y = random(0, canvas.height);
            this.size = random(60, 120);
            this.speed = random(0.1, 0.2);
        }

        draw() {
            ctx.beginPath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.arc(this.x + this.size * 0.5, this.y - this.size * 0.4, this.size * 0.7, 0, Math.PI * 2);
            ctx.arc(this.x + this.size * 1.5, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }

        update() {
            this.x += this.speed;
            if (this.x - this.size > canvas.width) {
                this.x = 0 - this.size;
                this.y = random(0, canvas.height / 2);
            }
        }
    }

    const clouds = [];
    for (let i = 0; i < 20; i++) {
        clouds.push(new Cloud());
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        clouds.forEach(cloud => {
            cloud.draw();
            cloud.update();
        });
        requestAnimationFrame(animate);
    }

    animate();

</script>
</body>
</html>
